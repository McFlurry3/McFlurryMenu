<!DOCTYPE html>

  <style>
    body {
      background: rgba(0,0,0,0);
      margin: 0;
      font-family: Arial;
    }

    #menu {
      width: 260px;
      padding: 0px 10px 8px;
      background: #1e1e1e;
      border-radius: 12px;
      color: white;
      box-shadow: 0 0 10px #000;
      display: flex;
      flex-direction: column;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #4CAF50;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    input[type="number"] {
      padding: 8px;
      border-radius: 8px;
      border: none;
      margin-top: 1px;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    .input-row button {
      flex: 1;
      width: 45%;
      margin-top: 0;
      order: 1;
    }

    .input-row input[type="number"] {
      flex: 1;
      width: 45%;
      order: 2;
    }

    .label-row {
      margin-top: 7px;
      margin-bottom: 0px;
      font-size: 13px;
      color: #ccc;
    }

    .tab {
      display: none;
    }

    .tab.active {
      display: block;
    }

    .tab-buttons {
      display: flex;
      justify-content: space-around;
      margin-top: -12px;
      margin-bottom: 5px;
    }

    .tab-buttons button {
      flex: 1;
      background: #333;
      width: 20%;
      font-size: 12px;
      padding: 8px;
    }

    .tab-buttons button.active {
      background: #4CAF50;
    }

    #menu-footer {
      margin-top: auto;
      text-align: center;
      font-size: 10px;
      color: #aaa;
      padding-top: 8px;
    }

    .freeze-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .freeze-grid button {
      width: 100%;
      margin-top: 0;
    }

    .dev-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
    }

    .dev-row button {
      flex: 1.2;
      margin-top: 0;
      padding: 6px;
      font-size: 11px;
    }

    .dev-row input[type="number"] {
      flex: 0.8;
      padding: 4px;
      font-size: 11px;
    }

    .dev-row .full-button {
      padding: 10px;
      font-size: 14px;
    }
  </style>
</head>

    const TIME_NOT_FOUND_ALERT = "Time address not found! Make sure to scan for time before using anything in the \"Time\" section or the \"Other\" section";

    function showTimeNotFoundAlert() {

    function showTab(id) {
      document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-buttons button').forEach(btn => btn.classList.remove('active'));

      document.getElementById(id).classList.add('active');

      if (tabBtn) {
        tabBtn.classList.add('active');
      }

    function AutoScanTimeStatic() {
      h5gg.require(7.8);
      h5gg.clearResults();

      h5gg.searchNumber("2139095040", "I32", "0x0", "0x200000000");
      h5gg.searchNearby("1101004800", "I32", "0x10");

      let count = h5gg.getResultsCount();
      if (count <= 0) {
        console.log("No timeStatic found");
        return;
      }

      let results = h5gg.getResults(count);
      let timeStatic = results[0].address;

      timeAddress = "0x" + (Number(timeStatic) - 0x9A0).toString(16);
      shotClockAddress = "0x" + (Number(timeAddress) + 0x30).toString(16);

      console.log("timeStatic:", timeStatic);
      console.log("timeAddress:", timeAddress);
      console.log("shotClockAddress:", shotClockAddress);
    }

	function actualGetInstantAddress() {
	  h5gg.require(7.8);
      h5gg.clearResults();
      h5gg.searchNumber("28743", "I32", "0x0", "0x200000000");
      h5gg.searchNearby("-1", "I32", "0x100");
      var count = h5gg.getResultsCount();
      var results = h5gg.getResults(count);

      if (count > 1) {
        instantAddress = results[1].address;
	  }
      if (!instantAddress) {
        alert("Instant win address not saved:" + instantAddress);
      }
	}

    function getInstantAddress() {
	  h5gg.require(7.8);
      h5gg.clearResults();
      instantWinInterval = setInterval(function() {
        if (instantAddress) {
          h5gg.setValue(instantAddress, "1", "I32");
          console.log("Instant win activated");
        }
      }, 1);
}

    function ToggleInstantWin() {

	  actualGetInstantAddress();
	  
      instantWinEnabled = !instantWinEnabled;
      const btn = document.getElementById("instantWinBtn");

      if (instantWinEnabled) {
        btn.textContent = "Instant Win (ON)";
        if (!timeAddress) { 
		  AutoScanTimeStatic();
		}

		if (!instantAddress) {
          actualGetInstantAddress();
        }
		
		getInstantAddress();
      } else {
        btn.textContent = "Instant Win (OFF)";
        if (instantWinInterval) {
          clearInterval(instantWinInterval);
          instantWinInterval = null;
        }
        if (instantAddress) {
          h5gg.setValue(instantAddress, "-1", "I32");
        }
      }
    }

    async function InstantWinFlash() {
      if (!timeAddress) {
        AutoScanTimeStatic();
      }
      

      if (!instantAddress) {
        actualGetInstantAddress();
      }

      var delay = parseInt(document.getElementById("flashDelay").value);
      if (isNaN(delay) || delay < 0) delay = 100;

      function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      }

      async function win(address) {
        h5gg.setValue(address, "1", "I32");
        await sleep(delay);
        h5gg.setValue(address, "-1", "I32");
      }

      await win(instantAddress);
      console.log("Instant win flashed at address:", instantAddress);
    }

    async function InstantWin15Loop() {
      const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
      console.log("InstantWin15 loop started");

      while (instantWin15Enabled) {
        await sleep(50);
        if (!timeAddress) {
          AutoScanTimeStatic();
        }
      if (!instantAddress) {
        actualGetInstantAddress();
      }

        if (timeAddress && instantAddress) {
          let currentVal = parseFloat(h5gg.getValue(timeAddress, "F64"));
          if (currentVal >= 10.0 && currentVal <= 12.0) {
            h5gg.setValue(instantAddress, "1", "I32");
            await sleep(500);
            h5gg.setValue(instantAddress, "-1", "I32");
            console.log("Instant win triggered at 15s");

            if (timeAddress) {
              h5gg.setValue(timeAddress, "0.0", "F64");
              console.log("Game time reset to 0 after instant win");
            }
          }
        }
      }
      console.log("InstantWin15 loop stopped");
    }

        InstantWin15Loop();

    async function EndGameAfter60sLoop() {
      const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
      while (endGame60Enabled) {
        await sleep(50);

        if (!timeAddress) {
          let scanValue = document.getElementById("scanValue").value;
          if (scanValue === "" || isNaN(scanValue)) scanValue = "120.0";
          h5gg.require(7.8);
          h5gg.clearResults();
          h5gg.searchNumber(scanValue, "F64", "0x0", "0x200000000");
          h5gg.searchNearby("24.0", "F64", "0x100");
          let count = h5gg.getResultsCount();
          if (count > 0) {
            let results = h5gg.getResults(1);
            timeAddress = results[0].address;
          }
        }

        if (!timeAddress) continue;

        quarterAddress = "0x" + (Number(timeAddress) - 0x64).toString(16);

        let currentValStr = h5gg.getValue(timeAddress, "F64");
        let currentVal = parseFloat(currentValStr);
        if (isNaN(currentVal)) continue;

        let didInstantWin = false;
        if (currentVal >= 58.0 && currentVal <= 59.0 && quarterAddress) {
          let quarterValStr = h5gg.getValue(quarterAddress, "I32");
          let quarterVal = parseInt(quarterValStr);
          if (quarterVal === 4) {
             if (!instantAddress) {
        	  actualGetInstantAddress();
		    }

            if (instantAddress) {
              h5gg.setValue(instantAddress, "1", "I32");
              await sleep(500);
              h5gg.setValue(instantAddress, "-1", "I32");
              didInstantWin = true;
            }
          }
        }

        if (didInstantWin) continue;

        if (currentVal < 67 && quarterAddress) {
          let qValStr = h5gg.getValue(quarterAddress, "I32");
          let qVal = parseInt(qValStr);
          if (qVal !== 4) {
            h5gg.setValue(timeAddress, "0", "F64");
          }
        }
      }
    }

    async function AlwaysWinRTCLoop() {
      const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

      while (alwaysWinRTCEnabled) {
        await sleep(50);

        if (!timeAddress) {
          h5gg.require(7.8);
          h5gg.clearResults();
          h5gg.searchNumber("180.0", "F64", "0x0", "0x200000000");
          h5gg.searchNearby("24.0", "F64", "0x100");
          let count = h5gg.getResultsCount();
          if (count > 0) {
            let results = h5gg.getResults(1);
            timeAddress = results[0].address;
          }
        }

        let currentVal = parseFloat(h5gg.getValue(timeAddress, "F64"));
        if (isNaN(currentVal)) continue;

        let quarterAddress = "0x" + (Number(timeAddress) - 0x64).toString(16);
        let quarterVal = parseInt(h5gg.getValue(quarterAddress, "I32"));

        if (quarterVal === 4 && currentVal >= 10.0 && currentVal <= 12.0) {
           if (!instantAddress) {
        	actualGetInstantAddress();
      	  }

          if (instantAddress) {
            h5gg.setValue(instantAddress, "1", "I32");
            await sleep(100);
            h5gg.setValue(instantAddress, "-1", "I32");
          }
        }
      }
    }
	
	function ToggleAlwaysWinFastBreak() {

          btn.textContent = "Always Win FastBreak (OFF)";
          return;
        }

        alwaysWinFastBreakAddress = "0x" + (Number(timeAddress) - 0x2F9F390).toString(16);

        alwaysWinFastBreakInterval = setInterval(function () {
          if (!timeAddress || !alwaysWinFastBreakAddress) return;
    
          let shotClockVal = parseFloat(h5gg.getValue(shotClockAddress, "F64"));
          let waveVal = parseInt(h5gg.getValue(alwaysWinFastBreakAddress, "I32"));
    
          if (!isNaN(shotClockVal) && !isNaN(waveVal)) {
            if (waveVal === 6 && shotClockVal > 4 && shotClockVal < 6) {
              InstantWinFlash();
              h5gg.setValue(alwaysWinFastBreakAddress, "0", "I32");
            }
          }
        }, 50);
      } else {
        btn.textContent = "Always Win FastBreak (OFF)";
        if (alwaysWinFastBreakInterval) {
          clearInterval(alwaysWinFastBreakInterval);
          alwaysWinFastBreakInterval = null;
        }
        alwaysWinFastBreakAddress = null;
      }
    }

      }
      if (!shotClockAddress) {
        showTimeNotFoundAlert();
        alwaysYourBallEnabled = false;
        document.getElementById("alwaysYourBallBtn").textContent = "Always Your Ball (OFF)";
        return;
      }

      const shotClockAddrNum = Number(shotClockAddress);
      const register_A = "0x" + (shotClockAddrNum - 0x60).toString(16);
      const register_B = "0x" + (shotClockAddrNum - 0x58).toString(16);

      alwaysYourBallInterval = setInterval(function() {
        let yourTeamId = h5gg.getValue(register_A, "I32");

    function startMatchObservationEngine() {
      h5gg.require(7.8);
      if (!shotClockAddress) {
        showTimeNotFoundAlert();
        return;
      }

      const shotClockAddrNum = Number(shotClockAddress);
      const register_A = "0x" + (shotClockAddrNum - 0x60).toString(16);
      const register_B = "0x" + (shotClockAddrNum - 0x58).toString(16);
      const register_C = shotClockAddress;

      let stored_alpha = null;
      let stored_beta = null;
      let lockout_status = false;
      let initializing_delay = false;

      if (match_observation_engine) {
        clearInterval(match_observation_engine);
      }

      match_observation_engine = setInterval(function() {
        let live_hex_1 = h5gg.getValue(register_A, "I32");
        let live_hex_2 = h5gg.getValue(register_B, "I32");

        if (!(live_hex_1 > 0 || live_hex_1 < 0) && !(live_hex_2 > 0 || live_hex_2 < 0)) {
          stored_alpha = null;
          stored_beta = null;
          lockout_status = false;
          initializing_delay = false;
          return;
        }

        if (stored_alpha === null && (live_hex_1 > 0 || live_hex_1 < 0)) {
          if ((live_hex_2 > 0 || live_hex_2 < 0) && live_hex_1 !== live_hex_2) {
            initializing_delay = true;
            stored_alpha = live_hex_1;
            stored_beta = live_hex_2;
            setTimeout(function() {
              let re_verify_1 = h5gg.getValue(register_A, "I32");
              let re_verify_2 = h5gg.getValue(register_B, "I32");
              if ((re_verify_1 > 0 || re_verify_1 < 0) && (re_verify_2 > 0 || re_verify_2 < 0)) {
                stored_alpha = re_verify_1;
                stored_beta = re_verify_2;
                initializing_delay = false;
              }
            }, 2000);
          }
        }

        if (!initializing_delay && live_hex_1 !== 0 && live_hex_1 !== stored_alpha && live_hex_1 !== stored_beta) {
          if (live_hex_2 !== 0) {
            stored_alpha = live_hex_1;
            stored_beta = live_hex_2;
            lockout_status = false;
          }
        }

        if (!initializing_delay && stored_beta !== null && live_hex_1 === stored_beta && live_hex_1 !== live_hex_2) {
          if (!lockout_status) {
            h5gg.setValue(register_C, "0", "F64");
            lockout_status = true;
          }
        } else if (live_hex_1 === stored_alpha) {
          lockout_status = false;
        }
      }, 150);
    }

  if (!Number.isInteger(startValue) || startValue < 10000 || startValue > 99999) {
    alert("Enter a valid 5-digit starting card value.");
    return;
  }

  if (!Number.isInteger(amount) || amount < 1) {
    alert("Enter an amount of at least 1.");
    return;
  }

  const themeInput = prompt(
    "Enter the theme value to set for every found card:",
    "0"
  );

  if (themeInput === null) return;

  const targetTheme = parseInt(themeInput.trim(), 10);

  if (!Number.isInteger(targetTheme)) {
    alert("Enter a valid theme value.");
    return;
  }

  h5gg.require("7.8");

  let cardsFound = 0;
  let themesChanged = 0;
  let noResultCards = [];

  for (let i = 0; i < amount; i++) {
    const cardValue = startValue + i;

    h5gg.clearResults();

    // Find the 5-digit card value, with the expected 7 nearby at +0x4.
    h5gg.searchNumber(String(cardValue), "I32", "0x0", "0x200000000");
    h5gg.searchNearby("7", "I32", "0x4");

    const count = h5gg.getResultsCount();

    if (count <= 0) {
      noResultCards.push(cardValue);
      continue;
    }

    const results = h5gg.getResults(count);
    let changedThisCard = false;

    for (const result of results) {
      // Prevent changing any nearby result that is not the actual card ID.
      if (parseInt(result.value, 10) !== cardValue) continue;

      const themeAddr =
        "0x" + (BigInt(result.address) + 0x18n).toString(16);

      h5gg.setValue(themeAddr, String(targetTheme), "I32");

      themesChanged++;
      changedThisCard = true;

      console.log(
        "Theme changed:",
        cardValue,
        "theme address:",
        themeAddr,
        "new theme:",
        targetTheme
      );
    }

    if (changedThisCard) {
      cardsFound++;
    } else {
      noResultCards.push(cardValue);
    }
  }

  const endValue = startValue + amount - 1;

  alert(
    "Change Themes complete.\n\n" +
    `Card range: ${startValue} - ${endValue}\n` +
    `Theme value set: ${targetTheme}\n` +
    `Cards found: ${cardsFound}\n` +
    `Theme addresses changed: ${themesChanged}\n` +
    `Not found: ${noResultCards.length}`
  );
}

function Change4Rummy() {
  // 5-digit card IDs laid out in the grid (blanks skipped).
 const numbers = [
  31468, 31470, 31371, 30946, 31545,
  30974, 31375, 31039, 31475, 31469,
  31478, 31296, 30775, 31294, 31476,
  30877, 31373, 31196, 30733,
  31162, 31239, 31235,
  30876, 30773, 31457, 31346,
  31266, 31283, 31234, 31042
];

  // Value to write into every matched 5-digit address.
  const TARGET_VALUE = "31545";

  h5gg.require(7.8);

  let changedTotal = 0;

  for (let i = 0; i < numbers.length; i++) {
    let num = numbers[i];
    let numStr = String(num);

    // Nearby scan: find `num` with a value of 7 within 0x4 bytes.
    h5gg.clearResults();
    h5gg.searchNumber(numStr, "I32", "0x0", "0x200000000");
    h5gg.searchNearby("7", "I32", "0x4");

    let count = h5gg.getResultsCount();
    if (count <= 0) {
      console.log("No results for " + numStr);
      continue;
    }

    // Only rewrite results whose value equals the searched 5-digit number
    // (leaves the "7" nearby matches untouched).
    let results = h5gg.getResults(count);
    let perNumber = 0;
    for (let j = 0; j < results.length; j++) {
      let r = results[j];
      if (parseInt(r.value) === num) {
        h5gg.setValue(r.address, TARGET_VALUE, "I32");
        perNumber++;
      }
    }

    changedTotal += perNumber;
    console.log("Changed " + perNumber + " match(es) for " + numStr + " -> " + TARGET_VALUE);
  }

  console.log("Change4Rummy complete. Total addresses changed: " + changedTotal);
  alert("Change4Rummy done.\nTotal addresses changed: " + changedTotal);
}

	  function EquipAllTeam() {
  // Same team-scan table as FindCard.
  const cases = [
    ["PG", "5288477624507516752", "1224979098644774980"],
    ["SG", "5288477624507516755", "1224979098644774980"],
    ["SF", "5288477624507516499", "1224979098644774980"],
    ["PF", "5288477624507516496", "1224979098644774980"],
    ["C",  "4920574510299832131", "1152921504606846976"]
  ];

  let input = prompt("Enter value to set all team codes to (e.g. 31545 or 30306):");
  if (input === null) return;
  let targetVal = String(input.trim());
  if (targetVal === "" || isNaN(parseInt(targetVal, 10))) {
    alert("Enter a valid number.");
    return;
  }

  h5gg.require(7.8);

  let changedTotal = 0;
  let report = [];

  for (let i = 0; i < cases.length; i++) {
    let pos = cases[i][0];
    let searchVal = cases[i][1];
    let nearbyVal = cases[i][2];

    // --- Step 1: run the team scan exactly like FindCard to get the 5-digit code ---
    h5gg.clearResults();
    h5gg.searchNumber(searchVal, "I64", "0x0", "0x200000000");
    h5gg.searchNearby(nearbyVal, "I64", "0x20");

    let teamCount = h5gg.getResultsCount();
    if (teamCount <= 0) {
      report.push(pos + ": no team base found");
      continue;
    }

    let teamResults = h5gg.getResults(1);
    let baseAddr = teamResults[0].address;
    let finalAddr = "0x" + (BigInt(baseAddr) + 0x10n).toString(16);

    let rawVal = h5gg.getValue(finalAddr, "I64");
    let hexString = BigInt(rawVal).toString(16).toUpperCase();

    let code = [10, 8, 6, 4, 2].map(p => {
      let idx = p - 1;
      return idx >= 0 && idx < hexString.length ? hexString[idx] : "";
    }).join("");

    // --- Step 2: nearby scan for that code (exactly like Change4Rummy) ---
    h5gg.clearResults();
    h5gg.searchNumber(code, "I32", "0x0", "0x200000000");
    h5gg.searchNearby("7", "I32", "0x4");

    let count = h5gg.getResultsCount();
    if (count <= 0) {
      report.push(pos + " (" + code + "): no nearby results");
      continue;
    }

    let results = h5gg.getResults(count);
    let perPos = 0;
    for (let j = 0; j < results.length; j++) {
      let r = results[j];
      if (parseInt(r.value, 10) === parseInt(code, 10)) {
        h5gg.setValue(r.address, targetVal, "I32");
        perPos++;
      }
    }

    changedTotal += perPos;
    report.push(pos + " (" + code + "): changed " + perPos);
  }

  console.log("EquipAllTeam complete. Total: " + changedTotal + "\n" + report.join("\n"));
  alert("EquipAllTeam done.\nTarget: " + targetVal + "\nTotal changed: " + changedTotal + "\n\n" + report.join("\n"));
}

function ToggleKillianator() {
  const btn = document.getElementById("killianatorBtn");
  const TARGET_VALUE = "20000";

  const cases = [
    ["PG", "5288477624507516752", "1224979098644774980"],
    ["SG", "5288477624507516755", "1224979098644774980"],
    ["SF", "5288477624507516499", "1224979098644774980"],
    ["PF", "5288477624507516496", "1224979098644774980"],
    ["C",  "4920574510299832131", "1152921504606846976"]
  ];

  // OFF: restore each saved original value to its original address.
  if (killianatorEnabled) {
    let restoredTotal = 0;
    let report = [];

    for (const [pos] of cases) {
      const savedEntries = killianatorBackup[pos] || [];
      let restoredForPosition = 0;

      for (const entry of savedEntries) {
        h5gg.setValue(entry.address, entry.originalValue, "I32");
        restoredForPosition++;
        restoredTotal++;
      }

      report.push(`${pos}: restored ${restoredForPosition}`);
    }

    killianatorEnabled = false;
    killianatorBackup = {
      PG: [],
      SG: [],
      SF: [],
      PF: [],
      C: []
    };

    btn.textContent = "Killianator OFF";

    console.log(
      "Killianator restored:",
      restoredTotal,
      report.join(" | ")
    );

    alert(
      "Killianator OFF\n\n" +
      `Restored ${restoredTotal} original value(s).\n\n` +
      report.join("\n")
    );

    return;
  }

  // ON: ask which positions should be changed.
  const input = prompt(
    "Enter positions to change!:\nExample: PG, SG, C\n\nLeave blank for all positions.",
    "PG, SG, SF, PF, C"
  );

  if (input === null) return;

  const validPositions = ["PG", "SG", "SF", "PF", "C"];

  let requested = input
    .split(",")
    .map(x => x.trim().toUpperCase())
    .filter(x => x.length > 0);

  if (requested.length === 0) {
    requested = [...validPositions];
  }

  requested = [...new Set(requested)];

  const invalid = requested.filter(
    pos => !validPositions.includes(pos)
  );

  if (invalid.length > 0) {
    alert(
      "Invalid position(s): " + invalid.join(", ") +
      "\n\nValid positions: PG, SG, SF, PF, C"
    );
    return;
  }

  const selected = cases.filter(([pos]) => requested.includes(pos));

  h5gg.require("7.8");

  // Clear old backups before making a new capture.
  killianatorBackup = {
    PG: [],
    SG: [],
    SF: [],
    PF: [],
    C: []
  };

  let changedTotal = 0;
  let report = [];

  for (const [pos, searchVal, nearbyVal] of selected) {
    // Find the team's current card code.
    h5gg.clearResults();
    h5gg.searchNumber(searchVal, "I64", "0x0", "0x200000000");
    h5gg.searchNearby(nearbyVal, "I64", "0x20");

    const teamCount = h5gg.getResultsCount();

    if (teamCount <= 0) {
      report.push(`${pos}: team base not found`);
      continue;
    }

    const teamResults = h5gg.getResults(1);
    const baseAddr = teamResults[0].address;
    const finalAddr = "0x" + (BigInt(baseAddr) + 0x10n).toString(16);

    const rawVal = h5gg.getValue(finalAddr, "I64");
    const hexString = BigInt(rawVal).toString(16).toUpperCase();

    const code = [10, 8, 6, 4, 2]
      .map(p => {
        const index = p - 1;
        return index >= 0 && index < hexString.length
          ? hexString[index]
          : "";
      })
      .join("");

    if (!code || isNaN(parseInt(code, 10))) {
      report.push(`${pos}: could not read card code`);
      continue;
    }

    // Find every actual I32 occurrence of that card code.
    h5gg.clearResults();
    h5gg.searchNumber(code, "I32", "0x0", "0x200000000");
    h5gg.searchNearby("7", "I32", "0x4");

    const resultCount = h5gg.getResultsCount();

    if (resultCount <= 0) {
      report.push(`${pos}: no card-value address found for ${code}`);
      continue;
    }

    const results = h5gg.getResults(resultCount);
    let changedForPosition = 0;

    for (const result of results) {
      const currentValue = parseInt(result.value, 10);

      // Only affect exact matches for the detected player code.
      if (currentValue !== parseInt(code, 10)) continue;

      // Save the real old value BEFORE overwriting it.
      killianatorBackup[pos].push({
        address: result.address,
        originalValue: String(result.value)
      });

      h5gg.setValue(result.address, TARGET_VALUE, "I32");

      changedForPosition++;
      changedTotal++;
    }

    report.push(
      `${pos}: saved/restored target count ${changedForPosition} ` +
      `(original card ${code})`
    );
  }

  // Do not show ON if nothing was actually modified.
  if (changedTotal === 0) {
    killianatorBackup = {
      PG: [],
      SG: [],
      SF: [],
      PF: [],
      C: []
    };

    alert(
      "Killianator did not find any values to change.\n\n" +
      report.join("\n")
    );

    return;
  }

  killianatorEnabled = true;
  btn.textContent = "Killianator ON";

  console.log(
    "Killianator enabled:",
    changedTotal,
    report.join(" | ")
  );

  alert(
    "Killianator ON\n\n" +
    `Changed ${changedTotal} player value(s) to ${TARGET_VALUE}.\n\n` +
    "Turn it OFF to restore the saved original values.\n\n" +
    report.join("\n")
  );
}
